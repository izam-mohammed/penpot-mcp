name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install check tools
        run: |
          make tools
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: make check
        run: make check
