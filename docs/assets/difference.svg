<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">the official penpot mcp against penpot-mcp</title>
  <desc id="d">A request passes through four parts through a browser tab to reach one file on the official penpot mcp, and stalls when the tab sleeps. On penpot-mcp it passes through three parts, straight to the penpot api and reaches any file. Counts: 0 tabs against 1, any file against one open file, 87 tools against 4 on the hosted server.</desc>
  <style>
    .bg{fill:#160b2e}
    .card{fill:#231247;stroke:#4b2a8a;stroke-width:2}
    .node{fill:#2d1a5c;stroke:#7b5fd0;stroke-width:2}
    .bad{fill:#3a1630;stroke:#ef476f;stroke-width:2}
    .good{fill:#0f3a3a;stroke:#06d6a0;stroke-width:2}
    .h{font:700 26px system-ui,sans-serif;fill:#fff}
    .l{font:600 17px system-ui,sans-serif;fill:#e8ddff;text-anchor:middle}
    .s{font:14px system-ui,sans-serif;fill:#b8a6e6;text-anchor:middle}
    .big{font:800 34px system-ui,sans-serif;text-anchor:middle}
    .cap{font:15px system-ui,sans-serif;fill:#b8a6e6;text-anchor:middle}
    .line{stroke:#7b5fd0;stroke-width:3;fill:none}
    .lineb{stroke:#ef476f;stroke-width:3;fill:none;stroke-dasharray:6 6}
  </style>
  <rect class="bg" width="1200" height="440" rx="24"/>

  <!-- official lane -->
  <text class="h" x="40" y="56">official penpot mcp</text>
  <g>
    <rect class="node" x="40"  y="84" width="200" height="64" rx="12"/><text class="l" x="140" y="122">claude</text>
    <rect class="node" x="300" y="84" width="200" height="64" rx="12"/><text class="l" x="400" y="122">mcp server</text>
    <rect class="bad"  x="560" y="84" width="260" height="64" rx="12">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text class="l" x="690" y="112">plugin in a browser tab</text>
    <text class="s" x="690" y="134">must stay open and awake</text>
    <rect class="node" x="880" y="84" width="280" height="64" rx="12"/><text class="l" x="1020" y="122">the one open file</text>
    <path class="line" d="M240 116H300M500 116H560"/>
    <path class="lineb" d="M820 116H880"/>
    <circle r="7" fill="#ffd166">
      <animateMotion dur="3s" repeatCount="indefinite" path="M240 116H680" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="cap" x="600" y="180">4 moving parts, 1 tab, 1 file. tab sleeps, the call stalls.</text>

  <!-- ours lane -->
  <text class="h" x="40" y="246">penpot-mcp</text>
  <g>
    <rect class="node" x="40"  y="274" width="200" height="64" rx="12"/><text class="l" x="140" y="312">claude</text>
    <rect class="good" x="300" y="274" width="200" height="64" rx="12"/><text class="l" x="400" y="312">penpot-mcp</text>
    <rect class="good" x="560" y="274" width="600" height="64" rx="12"/>
    <text class="l" x="860" y="302">penpot api</text>
    <text class="s" x="860" y="324">every team, project and file your token reaches</text>
    <path class="line" d="M240 306H300M500 306H560"/>
    <circle r="7" fill="#06d6a0">
      <animateMotion dur="2s" repeatCount="indefinite" path="M240 306H1100" keyTimes="0;1" calcMode="linear"/>
    </circle>
  </g>
  <text class="cap" x="600" y="370">3 moving parts, no tab, any file.</text>

  <!-- numbers -->
  <g>
    <text class="big" x="200" y="418" fill="#06d6a0">0 tabs <tspan fill="#8a78b8" font-size="18" font-weight="600">vs 1</tspan></text>
    <text class="big" x="600" y="418" fill="#06d6a0">any file <tspan fill="#8a78b8" font-size="18" font-weight="600">vs 1 open</tspan></text>
    <text class="big" x="1000" y="418" fill="#06d6a0">87 tools <tspan fill="#8a78b8" font-size="18" font-weight="600">vs 4</tspan></text>
  </g>
</svg>
