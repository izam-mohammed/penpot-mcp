<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">penpot-mcp</title>
  <desc id="d">A corkboard. A lost poster reads LOST TAB, with a photo of a sleeping browser tab: answers to penpot plugin, needs a tab, the right file and someone to keep it awake, last seen asleep behind 46 other tabs. Reward: none, we talk to the api now. Its tear-off tabs at the bottom say penpot-mcp, two already taken. Pinned beside it, an index card: FOUND, one api that talks to penpot directly, 87 tools, no tab, no babysittin', still visits the old tab on weekends, brew install --cask izam-mohammed/tap/penpot-mcp.</desc>

  <defs>
    <pattern id="cork" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#d9b27c"/>
      <circle cx="7" cy="9" r="2" fill="#c4975f"/><circle cx="31" cy="4" r="1.5" fill="#e8c999"/>
      <circle cx="52" cy="14" r="2.2" fill="#c4975f"/><circle cx="18" cy="30" r="1.6" fill="#e8c999"/>
      <circle cx="42" cy="36" r="2" fill="#c4975f"/><circle cx="60" cy="44" r="1.4" fill="#e8c999"/>
      <circle cx="10" cy="52" r="1.8" fill="#c4975f"/><circle cx="33" cy="58" r="2.2" fill="#e8c999"/>
      <circle cx="25" cy="44" r="1.2" fill="#c4975f"/><circle cx="56" cy="27" r="1.3" fill="#e8c999"/>
    </pattern>
    <!-- poster outline: the sheet plus the tear-off tabs still left -->
    <g id="sheet">
      <rect width="440" height="290"/>
      <rect x="0" y="290" width="55" height="58"/><rect x="55" y="290" width="55" height="58"/>
      <rect x="165" y="290" width="55" height="58"/><rect x="220" y="290" width="55" height="58"/>
      <rect x="330" y="290" width="55" height="58"/><rect x="385" y="290" width="55" height="58"/>
    </g>
  </defs>

  <!-- the board -->
  <rect width="1200" height="400" rx="18" fill="#b07a45"/>
  <rect x="14" y="14" width="1172" height="372" rx="8" fill="url(#cork)" stroke="#8a5a2e" stroke-width="2"/>

  <!-- LOST -->
  <g transform="translate(110 20) rotate(-2 220 176)">
    <use href="#sheet" transform="translate(5 7)" fill="#000000" fill-opacity="0.20"/>
    <use href="#sheet" fill="#fffef9"/>
    <!-- what's left of the two tabs somebody took -->
    <path d="M110 290 l6 7 l7 -5 l8 6 l7 -4 l8 6 l9 -4 l10 6 v-12z M275 290 l7 6 l8 -5 l7 7 l9 -6 l8 5 l7 -4 l9 5 v-8z" fill="#fffef9"/>
    <g stroke="#c8c2b4" stroke-width="1.4" stroke-dasharray="4 3">
      <line x1="0" y1="290" x2="440" y2="290"/>
      <line x1="55" y1="292" x2="55" y2="348"/><line x1="220" y1="292" x2="220" y2="348"/><line x1="385" y1="292" x2="385" y2="348"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#57534e" text-anchor="middle">
      <text transform="translate(31 319) rotate(-90)">penpot-mcp</text>
      <text transform="translate(86 319) rotate(-90)">penpot-mcp</text>
      <text transform="translate(196 319) rotate(-90)">penpot-mcp</text>
      <text transform="translate(251 319) rotate(-90)">penpot-mcp</text>
      <text transform="translate(361 319) rotate(-90)">penpot-mcp</text>
      <text transform="translate(416 319) rotate(-90)">penpot-mcp</text>
    </g>

    <text x="220" y="84" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="4" fill="#1f2328">LOST TAB</text>

    <!-- the photo: one browser tab, asleep on the job -->
    <rect x="26" y="98" width="152" height="124" fill="#cfcfcf" stroke="#8f8f8f"/>
    <rect x="34" y="186" width="136" height="28" fill="#8f8f8f"/>
    <path d="M48 186 q7 0 9 -8 l6 -32 q2 -8 10 -8 h58 q8 0 10 8 l6 32 q2 8 9 8 z" fill="#f2f2f2"/>
    <path d="M86 160 q6 5 12 0 M106 160 q6 5 12 0" fill="none" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M97 172 h10" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M128 147 l7 7 M135 147 l-7 7" stroke="#8f8f8f" stroke-width="2" stroke-linecap="round"/>
    <text x="146" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#333333">z<tspan font-size="12" dy="-8">z</tspan></text>

    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1f2328">
      <text x="194" y="116"><tspan font-weight="700">answers to:</tspan> penpot plugin</text>
      <text x="194" y="142"><tspan font-weight="700">needs:</tspan> a tab, the right file,</text>
      <text x="194" y="162">and someone to keep it awake</text>
      <text x="194" y="188"><tspan font-weight="700">last seen:</tspan> asleep, behind</text>
      <text x="194" y="208">46 other tabs</text>
    </g>
    <text x="220" y="254" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" fill="#c62828">REWARD: none.</text>
    <text x="220" y="277" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1f2328">we talk to the api now.</text>

    <circle cx="220" cy="13" r="9" fill="#e5484d"/><circle cx="217" cy="10" r="3.2" fill="#ffb3b5"/>
  </g>

  <!-- FOUND -->
  <g transform="translate(626 70) rotate(1.8 250 130)">
    <rect x="5" y="7" width="500" height="262" fill="#000000" fill-opacity="0.20"/>
    <rect width="500" height="262" fill="#fffef7"/>
    <line x1="0" y1="66" x2="500" y2="66" stroke="#ef9a9a" stroke-width="2"/>
    <g stroke="#cfe0f5" stroke-width="1.4">
      <line x1="0" y1="106" x2="500" y2="106"/><line x1="0" y1="140" x2="500" y2="140"/>
      <line x1="0" y1="174" x2="500" y2="174"/><line x1="0" y1="208" x2="500" y2="208"/>
      <line x1="0" y1="242" x2="500" y2="242"/>
    </g>
    <g font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" fill="#1f2937">
      <text x="26" y="52" font-size="34" font-weight="700" fill="#15803d">FOUND:</text>
      <text x="26" y="100" font-size="22">one api. talks to penpot directly.</text>
      <text x="26" y="134" font-size="22">87 tools. no tab. no babysittin'.</text>
      <text x="26" y="168" font-size="19">(still visits the old tab on weekends)</text>
    </g>
    <text x="26" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2937">brew install --cask izam-mohammed/tap/penpot-mcp</text>
    <circle cx="250" cy="14" r="10" fill="#3b82f6"/><circle cx="247" cy="11" r="3.4" fill="#bfdbfe"/>
  </g>
</svg>
