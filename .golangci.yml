version: "2"

linters:
  default: standard
  enable:
    - gosec
    - revive
    - errorlint
    - bodyclose
    - misspell
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/izam-mohammed/penpot-mcp
